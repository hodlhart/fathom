name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            # The freeze pins transitive packages that now require 3.11
            # (pydantic-settings, starlette, sse-starlette, python-multipart,
            # rpds-py, pycparser). This job still proves the code runs on the
            # 3.10 floor mcp supports, with a resolvable dependency set.
            pip install "mcp==1.30.0" "pytest==9.2.0" "ruff==0.17.6"
          else
            pip install -r requirements-dev.txt
          fi

      - name: Syntax check
        run: python -m compileall -q server.py client.py scripts tests

      - name: Lint
        run: ruff check .

      - name: Test
        # No live console is contacted: the suite runs against a recording
        # double and scripts/stub_console.py.
        run: python -m pytest -q
